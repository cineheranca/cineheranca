name: Descobrir novas fontes
on:
  schedule:
    - cron: "0 6 * * 1"   # segundas, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-news
jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/discover.py
        env:
          AUTO_APPROVE: ${{ vars.AUTO_APPROVE }}
      - name: Commit
        run: |
          git config user.name "cine-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add feeds.json data/candidatos.json
          git diff --staged --quiet || (git commit -m "chore: descoberta de fontes" && git push)
