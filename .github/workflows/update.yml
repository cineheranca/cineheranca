name: Atualizar notícias
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: update-news
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install feedparser requests deep-translator
      - run: python scripts/fetch_news.py
        env:
          LIBRETRANSLATE_URL: ${{ secrets.LIBRETRANSLATE_URL }}
          LIBRETRANSLATE_KEY: ${{ secrets.LIBRETRANSLATE_KEY }}
      - name: Commit
        run: |
          git config user.name "cine-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || (git commit -m "chore: atualiza notícias" && git push)
